name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd src/evoting_localstorage/project_evoting && npm ci

      - name: Run lint
        run: cd src/evoting_localstorage/project_evoting && npm run lint

  test-node:
    runs-on: ubuntu-latest
    needs: lint-node
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd src/evoting_localstorage/project_evoting && npm ci

      - name: Run tests
        run: cd src/evoting_localstorage/project_evoting && npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: src/evoting_localstorage/project_evoting/coverage/

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 (Critical Errors only)
        # Stop the build if there are Python syntax errors or undefined names
        run: flake8 src/db-sm-rsm/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run flake8 (Style Warnings)
        # Run style checks but don't fail the build for now
        run: flake8 src/db-sm-rsm/ --max-line-length=120 --exclude=__pycache__ --count --exit-zero --statistics

  validate-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

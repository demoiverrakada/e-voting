name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd src/evoting_localstorage/project_evoting && npm ci

      - name: Run lint
        run: cd src/evoting_localstorage/project_evoting && npm run lint

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 src/db-sm-rsm/ --max-line-length=120 --exclude=__pycache__ --count

  validate-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

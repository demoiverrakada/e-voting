services:
  nginx:
    image: nginx:latest
    container_name: nginx-saas
    ports:
      - "80:80"
    depends_on:
      - admin-webpage
      - ea-server
    volumes:
      - ./nginx/saas.conf:/etc/nginx/conf.d/default.conf
  ea-server:
    build: .
    container_name: ea-server-saas
    working_dir: /app/evoting_localstorage/project_evoting
    command: /root/.nvm/versions/node/v22.3.0/bin/node index.js
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://root:pass@ea-db:27017/evoting?authSource=admin
      - JWT_KEY=saas-demo-secret-change-before-production
      - NODE_ENV=development
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost,http://localhost:80
      - RAZORPAY_KEY_ID=rzp_test_placeholder
      - RAZORPAY_KEY_SECRET=placeholder_secret
    depends_on:
      - ea-db
    volumes:
      - ./src/evoting_localstorage/project_evoting:/app/evoting_localstorage/project_evoting
      - /app/evoting_localstorage/project_evoting/node_modules
  ea-db:
    image: mongo:latest
    container_name: ea-db-saas
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=pass
    volumes:
      - ea-db-saas-data:/data/db
  admin-webpage:
    build: .
    container_name: admin-webpage-saas
    working_dir: /app/evoting_localstorage/admin_webpage
    command: /root/.nvm/versions/node/v22.3.0/bin/npm start
    environment:
      - REACT_APP_API_BASE_URL=
      - BROWSER=none
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./src/evoting_localstorage/admin_webpage:/app/evoting_localstorage/admin_webpage
      - /app/evoting_localstorage/admin_webpage/node_modules
volumes:
  ea-db-saas-data:


services:
  nginx:
    image: nginx:latest
    container_name: nginx-ev
    ports:
      - "80:80"
    depends_on:
      - admin-webpage
      - ea-server
      - verif-server
      - bulletin
      - verification-webpage
      - demo
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

  ea-server:
    build: .
    working_dir: /app/evoting_localstorage/project_evoting
    command: /root/.nvm/versions/node/v22.3.0/bin/node --watch index
    ports:
      - "5000:5000"
    links:
      - ea-db
    volumes:
    - ./output:/output
    - ./encrypted_output:/encrypted_output
    - ./src/evoting_localstorage/project_evoting:/app/evoting_localstorage/project_evoting
    - /app/evoting_localstorage/project_evoting/node_modules
    cpu_count: 4
    cpus: 4.0
    cpu_shares: 1024
    mem_limit: 32G

  ea-db:
    image: mongo:latest
    hostname: eadb
    environment:
    - MONGO_INITDB_ROOT_USERNAME=root
    - MONGO_INITDB_ROOT_PASSWORD=pass
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d
    ports:
      - 27017:27017

  verif-server:
    build: .
    working_dir: /app/evoting_localstorage/verification_server
    command: /root/.nvm/versions/node/v22.3.0/bin/node --watch index
    ports:
      - "7000:7000"
    volumes:
    - ./output:/output
    - ./src/evoting_localstorage/verification_server:/app/evoting_localstorage/verification_server
    - /app/evoting_localstorage/verification_server/node_modules

  bulletin:
      build: .
      working_dir: /app/evoting_localstorage/bulletin
      command: /root/.nvm/versions/node/v22.3.0/bin/npm start
      ports:
        - "5001:3000"
      volumes:
        - ./src/evoting_localstorage/bulletin:/app/evoting_localstorage/bulletin
        - /app/evoting_localstorage/bulletin/node_modules

  admin-webpage:
      build: .
      working_dir: /app/evoting_localstorage/admin_webpage
      command: /root/.nvm/versions/node/v22.3.0/bin/npm start
      ports:
        - "3000:3000"
      volumes:
        - ./src/evoting_localstorage/admin_webpage:/app/evoting_localstorage/admin_webpage
        - /app/evoting_localstorage/admin_webpage/node_modules

  verification-webpage:
      build: .
      working_dir: /app/evoting_localstorage/verification-webpage
      command: /root/.nvm/versions/node/v22.3.0/bin/npm start
      ports:
        - "7001:3000"
      volumes:
        - ./src/evoting_localstorage/verification-webpage:/app/evoting_localstorage/verification-webpage
        - /app/evoting_localstorage/verification-webpage/node_modules

  demo:
    build: .
    working_dir: /app/evoting_localstorage/demo
    command: /root/.nvm/versions/node/v22.3.0/bin/npm start
    ports:
      - "8080:3000"
    environment:
    - BROWSER=none
    volumes:
      - ./src/evoting_localstorage/demo:/app/evoting_localstorage/demo
      - /app/evoting_localstorage/demo/node_modules
  
